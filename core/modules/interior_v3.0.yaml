  roadmap_v4:
    next_version: "V4.0"
    title: "Post-Construction Cleaning, Contractor Coordination and Project Closeout Systems"
    focus:
      - Post-construction interior cleaning systems.
      - Rough, final, and touch-up cleaning phases.
      - Construction dust control and sequencing.
      - Adhesives, labels, films, paint, grout haze, and residue boundaries.
      - New-surface protection and manufacturer restrictions.
      - Contractor coordination, punch-list management, and completion documentation.
      - Production planning, estimating, quality control, and escalation rules.
