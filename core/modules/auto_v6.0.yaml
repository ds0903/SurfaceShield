document_id: SSBOS-001-AIM5-V6.0
title: "Master Integration, AI Routing & Developer Framework"
version: "6.0"
module: AIM5
division: auto
namespace: auto-division
owner: Surface Shield Systems LLC
document_role: master-integration-ai-routing-developer-framework
status: developer-ready
routing_priority: governance
audience: [public-ai, technician, office, management, developer]
risk_level: [general, elevated, escalation-required]
package_status: "Versions 1.0-6.0 complete"
note: >
  V6.0 is the master integration layer. It does not replace V1.0-V5.0; it governs
  how those controlled sources are routed, prioritized, combined, and escalated.
  V6.0 global boundaries and escalation apply AFTER source retrieval and BEFORE
  the final answer is generated.
