        retrieval_use: Primary orchestration layer.

  developer_integration_standard:
    title: "Developer Integration Standard"
    chunk: developer-integration
    risk_level: general
    rules:
      - Store Version 10.0 as the primary Exterior Division routing and policy layer, not as the only knowledge source.
      - Preserve source document ID, version, section, service class, surface, contamination, equipment, audience, risk and confidence metadata.
      - Chunk by operational concept rather than arbitrary page length.
      - Return the smallest sufficient set of relevant chunks and avoid loading the full module into every prompt.
      - Give safety, label, manufacturer, knowledge-boundary and escalation chunks precedence over general procedural guidance.
      - Support source traceability so internal users can identify the originating version and section.
      - Separate public-facing content from internal pricing, management and developer content.
      - Log low-confidence or high-risk requests for review and continuous improvement.

