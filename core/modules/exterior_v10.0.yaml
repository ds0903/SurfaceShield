      "3.0":
        primary_domain: Pressure washers, GPM, PSI, pumps, unloaders, nozzles, injectors, reels and maintenance.
        retrieval_use: Equipment selection and troubleshooting.
      "4.0":
        primary_domain: Wood science, stripping, brightening, moisture, sanding and finish systems.
        retrieval_use: Deck and fence restoration.
      "5.0":
        primary_domain: Concrete, masonry, stone, pavers, specialty stains and sealing.
        retrieval_use: Hard-surface service routing.
      "6.0":
        primary_domain: Commercial exterior cleaning, facility maintenance, access, runoff and recurring service.
        retrieval_use: Commercial operations.
      "7.0":
        primary_domain: Glass, pure water, water-fed poles, hard-water stains, solar and specialty surfaces.
        retrieval_use: Window and specialty-surface service.
      "8.0":
        primary_domain: Assessment, production, labor, pricing, proposals and maintenance programs.
        retrieval_use: Estimating and business operations.
      "9.0":
