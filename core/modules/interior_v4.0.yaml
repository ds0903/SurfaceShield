  roadmap_v5:
    next_version: "V5.0"
    title: "Residential Deep Cleaning & Room-Level SOPs"
    focus:
      - Residential deep-cleaning systems and room-level SOPs.
      - Kitchen, bathroom, bedroom, living-area, basement, garage and move-in / move-out workflows.
      - Soil classification, product routing, tool selection and cross-contamination controls.
      - Pet, child, allergy, fragrance and occupied-home considerations.
      - Estimating, production, quality control, customer communication and escalation rules.
