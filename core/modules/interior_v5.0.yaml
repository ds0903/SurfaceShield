    risk_level: general
    principle: >
      Index Version 5.0 as the residential Interior Division operating layer. Retrieval
      should route by service class, room, soil type, surface, occupancy, audience and
      risk. AI-boundary and escalation chunks must override procedural content.
      Public-facing retrieval must exclude confidential internal pricing, staff
      procedures and customer data.
