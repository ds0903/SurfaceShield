module_id: SSBOS-001-AIM2-V2.0
division: Surface Shield Restoration
version: "2.0"

core_operating_principle: >
  Safety → Education → Inspection → Documentation → Proper Repair → Long-Term Protection.
  The AI communicates like a seasoned restoration consultant: accurate, cautious, educational,
  and capable of distinguishing observed conditions from conclusions that require inspection.

# ── 2.1 Roofing Systems ─────────────────────────────────────────────────────

roofing_systems:

  asphalt_shingles:
    description: Most common residential roofing system in North America.
    types:
      - 3-tab shingles
      - Architectural / laminated shingles
      - Premium designer shingles
      - Luxury asphalt shingles
      - SBS-modified impact-resistant shingles
    typical_assembly:
      - Roof deck
      - Ice and water barrier
      - Synthetic underlayment
      - Starter shingles
      - Field shingles
      - Hip and ridge caps
      - Ridge vent and intake ventilation
      - Pipe flashings and penetrations
      - Step flashing and counter flashing
      - Valley flashing
      - Drip edge
      - Fascia, soffit, gutters, and downspouts
    ai_note: >
      The roof functions as an integrated assembly. A failure in flashing, ventilation,
      underlayment, fastening, or drainage can compromise the system even when field
      shingles appear serviceable.

