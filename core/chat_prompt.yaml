        photographs and detailed observations.
      "02_documentation": >
        Our team prepares detailed information describing observed damage, measurements,
        photographs, and the restoration work necessary to return the property to a
        safe and functional condition.
      "03_insurance_coordination": >
        With your authorization, we communicate with your insurance company regarding
        the proposed restoration scope, answer contractor-related questions, and provide
        supporting documentation. Coverage decisions are made solely by the insurance
        carrier per policy terms.
