  storm_damage:
    name: Storm Damage & Insurance Restoration
    url: /services/restoration/storm-damage/
    tagline: "HELPING HOMEOWNERS NAVIGATE THE RESTORATION PROCESS WITH CONFIDENCE"
    description: >
      Experiencing storm damage can be overwhelming. Surface Shield Restoration
      makes the restoration process easier by providing professional documentation,
      clear communication, and high-quality restoration services.
    process:
      "01_inspection": >
        Every project begins with a comprehensive inspection of the affected property.
        We evaluate roofing systems, siding, gutters, flashing, skylights, ventilation,
        and other exterior components for storm-related damage, documented with
        photographs and detailed observations.
      "02_documentation": >
        Our team prepares detailed information describing observed damage, measurements,
        photographs, and the restoration work necessary to return the property to a
        safe and functional condition.
      "03_insurance_coordination": >
        With your authorization, we communicate with your insurance company regarding
        the proposed restoration scope, answer contractor-related questions, and provide
        supporting documentation. Coverage decisions are made solely by the insurance
        carrier per policy terms.
      "04_building_code": >
        If current building code requirements affect the restoration process, we document
        those requirements and provide supporting information for review.
      "05_restoration": >
        Once approved and scheduled, our experienced crews complete the restoration using
        premium materials, professional installation, and careful attention to detail.
        Every project concludes with a thorough cleanup and final walkthrough.
    faq:
      can_choose_contractor: >
        In most cases, yes. Property owners generally have the right to choose their
        own contractor for restoration work.
      additional_damage: >
        Some damage may not be visible until construction begins. If additional
        storm-related damage is uncovered, it can be documented and submitted to
        the insurance company for review.
      communicate_with_insurance: >
        Yes. With your authorization, we can communicate directly with your insurance
        company regarding contractor-related aspects of the restoration.
      upgrade_materials: >
        In many cases, yes. Property owners often have the option to upgrade roofing
        materials, paying the difference between standard replacement and the upgraded
        selection.
      deductible: >
        Your deductible is the portion of the claim you are responsible for per your
        policy terms. We do not waive, absorb, or pay deductibles.

